        else if (power < 0) {
          // Battery discharging
          if (soc <= 5.0f) {
            it.printf(X0 + 173, Y0 + 271, id(mdi_small), TextAlign::BASELINE_LEFT, ICON_battery_alert_variant_outline);
          } else if (soc <= 30.0f) {
