          } else if (soc <= 65.0f) {
            it.printf(X0 + 173, Y0 + 271, id(mdi_small), TextAlign::BASELINE_LEFT, ICON_battery_medium);
          } else {
            it.printf(X0 + 173, Y0 + 271, id(mdi_small), TextAlign::BASELINE_LEFT, ICON_battery_high);
          }
        }
        else {
          // Battery neither charging nor discharging (evtl. 0W oder Messfehler) → unknown
          it.printf(X0 + 173, Y0 + 271, id(mdi_small), TextAlign::BASELINE_LEFT, ICON_battery_unknown);
        }
      } 
      else {
