time:
  - platform: sntp
    timezone: Europe/Berlin
    id: sntp_time

        
#Sensor inside############################################
bme680_bsec:
  - id: bme680
    i2c_id: "bme680_1"
    address: 0x77

sensor:
  - platform: bme680_bsec
    bme680_bsec_id: bme680
    temperature:
      name: "Temperatur"
      sample_rate: lp
      accuracy_decimals: 1
      id: temp_indoor
    pressure:
      name: "Luftdruck"
      sample_rate: lp
      accuracy_decimals: 5
      id: pressure
    humidity:
      name: "Luftfeuchtigkeit"
      sample_rate: lp
      id: humidity_indoor
      accuracy_decimals: 1
    iaq:
      name: "IAQ"
      id: iaq_indoor
      accuracy_decimals: 1
    co2_equivalent:
      name: "CO2 Equivalent"
      id: CO2_indoor
      accuracy_decimals: 1
      on_value:
        then:
          - lambda: 'id(BME_updated) = true;'
    gas_resistance:
      name: "Gas Resistance"
      id: gas
      accuracy_decimals: 5
    breath_voc_equivalent:
      name: "Intake Breath VOC Equivalent"
      id: VOC_indoor
      accuracy_decimals: 1
  - platform: homeassistant
    name: "Outdoor temperature"
    id: temp_outdoor
    entity_id: sensor.gw2000a_outdoor_temperature
  - platform: homeassistant
    name: "Outdoor pressure"
    id: pressure_outdoor
    entity_id: sensor.gw2000a_absolute_pressure
  - platform: homeassistant
    name: "Humidity"
    id: humidity_outdoor
    entity_id: sensor.gw2000a_humidity
  - platform: homeassistant
